name: retrieval-eval

on:
  push:
    branches: [main]
  pull_request:

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run retrieval eval (fails if recall@3 drops below 90%)
        run: python eval/run_eval.py --k 3 --min-recall 0.9
